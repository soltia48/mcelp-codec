name: Release

# Tag a commit to release it:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# The tag has to match the version in Cargo.toml; the first job checks that
# before anything is published.
#
# The jobs run in this order, and the order is the point:
#
#     verify ──► binaries ──┬──► github-release
#                           └──► publish        (crates.io)
#
# Publishing to crates.io cannot be undone — a version can be yanked, but not
# removed, and the number can never be reused.  So everything that can still
# fail runs first: the suite, the packaging, and a build of the command line
# tools on all three platforms with a bit-exactness check on each.  Only once
# all of that has passed does anything irreversible happen.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag and Cargo.toml must agree
        id: version
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "manual run, Cargo.toml says $manifest"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag, Cargo.toml $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      # A release must not ship anything the suite has not passed on.
      - name: Test
        run: cargo test --release

      - name: Package
        run: cargo package

  publish:
    name: Publish to crates.io
    # Gated on `binaries` as well as `verify`: this is the one step that cannot
    # be taken back, so it goes last.  A crate published against tools that turn
    # out not to build, or not to be bit exact, is not something a yank fixes.
    needs: [verify, binaries]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add a protection rule to this environment if you want a manual approval
    # step before anything reaches crates.io.
    environment: crates-io
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  binaries:
    name: Command line tools (${{ matrix.target }})
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bins

      # This is the last gate before `publish`, so it covers the same ground as
      # the check in ci.yml rather than a sample of it.
      - name: Check the built tools are bit exact
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          for name in male female; do
            "$dir/mcelp_encode$suffix" < "examples/$name.orig.ulaw" > "$name.mcelp"
            cmp "$name.mcelp" "examples/$name.mcelp"

            "$dir/mcelp_decode$suffix" < "examples/$name.mcelp" > "$name.ulaw"
            cmp "$name.ulaw" "examples/$name.decoded.ulaw"
          done
          echo "encoder and decoder are bit exact on ${{ matrix.target }}"

      - name: Assemble the archive
        shell: bash
        run: |
          set -euo pipefail
          name="mcelp-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          cp "target/${{ matrix.target }}/release/mcelp_encode$suffix" "$name/"
          cp "target/${{ matrix.target }}/release/mcelp_decode$suffix" "$name/"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [verify, binaries]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
