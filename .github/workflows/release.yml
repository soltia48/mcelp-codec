name: Release

# Tag a commit to release it:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag has to match the version in Cargo.toml; the first job checks that
# before anything is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag and Cargo.toml must agree
        id: version
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "manual run, Cargo.toml says $manifest"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag, Cargo.toml $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      # A release must not ship anything the suite has not passed on.
      - name: Test
        run: cargo test --release

      - name: Package
        run: cargo package

  publish:
    name: Publish to crates.io
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add a protection rule to this environment if you want a manual approval
    # step before anything reaches crates.io.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  binaries:
    name: Command line tools (${{ matrix.target }})
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Check the built tools are bit exact
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          "$dir/mcelp_encode$suffix" < examples/male.orig.ulaw > male.mcelp
          cmp male.mcelp examples/male.mcelp
          "$dir/mcelp_decode$suffix" < examples/male.mcelp > male.ulaw
          cmp male.ulaw examples/male.decoded.ulaw

      - name: Assemble the archive
        shell: bash
        run: |
          set -euo pipefail
          name="mcelp-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          cp "target/${{ matrix.target }}/release/mcelp_encode$suffix" "$name/"
          cp "target/${{ matrix.target }}/release/mcelp_decode$suffix" "$name/"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [verify, binaries]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
